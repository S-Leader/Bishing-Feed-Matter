plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = project.group
version = project.version

base {
    archivesName = "${archives_name}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                fishingmadebetter {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}


repositories {
    mavenCentral()
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Xander'; url = 'https://maven.isxander.dev/releases' }
    maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("dev.isxander:yet-another-config-lib:${yacl_version}-forge")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    compileOnly fg.deobf("maven.modrinth:aquaculture:${aquaculture_version}")
    runtimeOnly fg.deobf("maven.modrinth:aquaculture:${aquaculture_version}")
    runtimeOnly fg.deobf('maven.modrinth:nether-depths-upgrade:3.1.5-1.20')
    runtimeOnly fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.4')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'fishingmadebetter.refmap.json'
    config 'fishingmadebetter.forge.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            version: version,
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            mod_name: mod_name,
            mod_author: mod_author,
            mod_id: mod_id,
            license: license,
            description: mod_description,
            forge_version: forge_version,
            forge_loader_version_range: forge_loader_version_range,
            credits: credits,
            java_version: java_version,
            yacl_version: yacl_version,
            yacl_version_range: yacl_version_range
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_author,
                'Specification-Version': archiveVersion,
                'Implementation-Title': project.name,
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor': mod_author,
                'MixinConfigs': 'fishingmadebetter.forge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
